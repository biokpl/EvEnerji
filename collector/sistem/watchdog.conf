# /etc/systemd/system.conf.d/watchdog.conf
# Donanım bekçisi: işletim sistemi kilitlenirse Raspberry Pi'nin bekçi devresi Pi'yi
# kendiliğinden yeniden başlatır (BCM2835 en fazla ~15 sn destekler).
# Kapatmak için bu dosyayı silip: sudo systemctl daemon-reexec
[Manager]
RuntimeWatchdogSec=14
RebootWatchdogSec=2min
